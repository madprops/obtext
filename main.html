<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBText — Animated Text Slides</title>
    <meta name="description" content="Configurable animated text slides for OBS product showcases and explainer videos.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="grid-overlay"></div>
    <div class="particles" id="particles"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <main class="stage" id="stage">
        <div class="text-container" id="text_target"></div>
        <div class="progress-wrap">
            <div class="progress-bar" id="progress_bar"></div>
        </div>
    </main>

    <!-- Subtle control dock -->
    <nav class="dock" id="dock" aria-label="Presentation controls">
        <button class="dock-btn dock-btn-editor" id="btn_editor" title="Edit slides (E)" aria-label="Edit slides">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M4 6h16" />
                <path d="M4 12h10" />
                <path d="M4 18h7" />
                <path d="M17 15l3 3-3 3" />
            </svg>
        </button>

        <span class="dock-sep"></span>

        <button class="dock-btn dock-btn-start" id="btn_start" title="Start (Space)" aria-label="Start">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" />
            </svg>
        </button>

        <button class="dock-btn dock-btn-stop" id="btn_stop" title="Stop (Space)" aria-label="Stop">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2.5" />
            </svg>
        </button>

        <button class="dock-btn dock-btn-restart" id="btn_restart" title="Restart (R)" aria-label="Restart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 3-6.7" />
                <path d="M3 4v5h5" />
            </svg>
        </button>

        <span class="dock-sep"></span>

        <span class="dock-status" id="dock_status" data-state="idle">
            <i class="dock-dot"></i>
            <span id="slide_counter">– / 0</span>
        </span>
    </nav>

    <!-- Slide editor -->
    <div class="editor-backdrop" id="editor_backdrop"></div>

    <section class="editor" id="editor" aria-hidden="true" aria-labelledby="editor_title">
        <header class="editor-head">
            <div class="editor-titles">
                <span class="editor-kicker">Script</span>
                <h1 class="editor-title" id="editor_title">Slides</h1>
            </div>

            <div class="editor-meta">
                <span class="editor-pill" id="editor_count">0 slides</span>
                <span class="editor-pill editor-pill-dim" id="editor_time">~0s</span>
            </div>

            <button class="editor-close" id="btn_editor_close" title="Close (Esc)" aria-label="Close editor">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M6 6l12 12M18 6L6 18" />
                </svg>
            </button>
        </header>

        <div class="editor-body">
            <textarea id="editor_input" spellcheck="false" placeholder="hello world&#10;---&#10;this is a test"></textarea>
        </div>

        <footer class="editor-foot">
            <div class="editor-hint">
                <span>Separate slides with <code>---</code></span>
                <span class="hint-dot"></span>
                <span>Highlight <code class="c-cyan">*cyan*</code> <code class="c-pink">_pink_</code> <code
                        class="c-green">~green~</code></span>
                <span class="hint-dot"></span>
                <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to apply</span>
            </div>

            <button class="btn-apply" id="btn_apply">
                <span class="btn-apply-label">Apply</span>
            </button>
        </footer>
    </section>

    <script src="base.js"></script>
</body>

</html>
